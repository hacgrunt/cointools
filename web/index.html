<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cointools — Top Holder Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --bg: #09090b; --surface: #18181b; --border: #27272a; --muted: #71717a;
    --text: #e4e4e7; --green: #22c55e; --red: #ef4444; --blue: #3b82f6;
    --yellow: #eab308; --cyan: #06b6d4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }

  .header {
    border-bottom: 1px solid var(--border); padding: 1.2rem 2rem;
    display: flex; align-items: center; gap: 1rem;
  }
  .header h1 { font-size: 1.1rem; font-weight: 600; }
  .header .tag {
    font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border); color: var(--muted);
  }
  .header .spacer { flex: 1; }
  .gear-btn {
    background: none; border: 1px solid var(--border); border-radius: 6px;
    color: var(--muted); padding: 0.35rem 0.6rem; cursor: pointer; font-size: 0.85rem;
    transition: all 0.15s;
  }
  .gear-btn:hover { color: var(--text); border-color: var(--muted); }
  .gear-btn.has-key { color: var(--green); border-color: color-mix(in srgb, var(--green) 40%, transparent); }

  /* Settings panel */
  .settings-panel {
    max-width: 720px; margin: 0 auto; padding: 0 1.5rem;
    overflow: hidden; max-height: 0; transition: max-height 0.3s ease;
  }
  .settings-panel.open { max-height: 200px; }
  .settings-inner {
    padding: 1rem 0; border-bottom: 1px solid var(--border);
  }
  .settings-inner p { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.5rem; }
  .settings-inner a { color: var(--cyan); text-decoration: none; }
  .settings-inner a:hover { text-decoration: underline; }
  .key-row { display: flex; gap: 0.5rem; }
  .key-row input {
    flex: 1; padding: 0.5rem 0.75rem; border-radius: 6px; font-size: 0.85rem;
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    font-family: monospace; outline: none;
  }
  .key-row input:focus { border-color: var(--muted); }
  .key-row button {
    padding: 0.5rem 1rem; border-radius: 6px; border: none; font-size: 0.8rem;
    background: var(--green); color: #000; font-weight: 600; cursor: pointer;
  }
  .key-saved { font-size: 0.78rem; color: var(--green); margin-top: 0.3rem; display: none; }

  /* Search */
  .search-wrap { max-width: 720px; margin: 2.5rem auto 0; padding: 0 1.5rem; }
  .search-box { display: flex; gap: 0.5rem; }
  .search-box input {
    flex: 1; padding: 0.7rem 1rem; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    font-size: 0.95rem; font-family: monospace; outline: none; transition: border 0.15s;
  }
  .search-box input:focus { border-color: var(--muted); }
  .search-box input::placeholder { color: var(--muted); font-family: sans-serif; }
  .search-box button {
    padding: 0.7rem 1.4rem; border-radius: 8px; border: none;
    background: #fff; color: #000; font-weight: 600; font-size: 0.9rem;
    cursor: pointer; white-space: nowrap; transition: opacity 0.15s;
  }
  .search-box button:hover { opacity: 0.85; }
  .search-box button:disabled { opacity: 0.4; cursor: not-allowed; }

  .options-row {
    display: flex; gap: 1rem; margin-top: 0.75rem; flex-wrap: wrap; align-items: center;
  }
  .options-row label { font-size: 0.8rem; color: var(--muted); }
  .pill-group { display: flex; }
  .pill-group button {
    padding: 0.3rem 0.7rem; font-size: 0.78rem; border: 1px solid var(--border);
    background: var(--surface); color: var(--muted); cursor: pointer; transition: all 0.15s;
  }
  .pill-group button:first-child { border-radius: 6px 0 0 6px; }
  .pill-group button:last-child { border-radius: 0 6px 6px 0; }
  .pill-group button:not(:first-child) { border-left: none; }
  .pill-group button.active { background: var(--text); color: var(--bg); border-color: var(--text); }

  .chain-badge {
    font-size: 0.78rem; padding: 0.25rem 0.6rem; border-radius: 6px;
    background: var(--surface); border: 1px solid var(--border); color: var(--muted);
  }
  .chain-badge.detected { color: var(--cyan); border-color: color-mix(in srgb, var(--cyan) 30%, transparent); }

  .status {
    max-width: 720px; margin: 1.5rem auto 0; padding: 0 1.5rem;
    font-size: 0.85rem; color: var(--muted); min-height: 1.2rem;
  }
  .status.error { color: var(--red); }

  /* Results */
  .results { max-width: 960px; margin: 1.5rem auto 0; padding: 0 1.5rem; display: none; }
  .results.visible { display: block; }

  .summary-bar {
    display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; margin-bottom: 1.5rem;
  }
  .summary-stat {
    padding: 0.5rem 1rem; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--border); font-size: 0.85rem;
  }
  .summary-stat .val { font-weight: 700; font-size: 1rem; }
  .summary-stat .lbl { color: var(--muted); font-size: 0.75rem; }
  .sentiment-badge {
    padding: 0.4rem 1rem; border-radius: 8px; font-weight: 700;
    font-size: 0.9rem; text-transform: uppercase;
  }

  .charts-grid {
    display: grid; grid-template-columns: 5fr 3fr; gap: 1rem; margin-bottom: 1.5rem;
  }
  .chart-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 1rem;
  }
  .chart-card h3 { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.5rem; font-weight: 500; }
  canvas { max-height: 280px; }

  .holders-table {
    width: 100%; border-collapse: collapse; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 2rem;
  }
  .holders-table th {
    text-align: left; padding: 0.6rem 0.75rem;
    background: color-mix(in srgb, var(--surface) 80%, var(--border));
    color: var(--muted); font-size: 0.72rem; text-transform: uppercase;
    letter-spacing: 0.05em; font-weight: 600;
  }
  .holders-table td {
    padding: 0.55rem 0.75rem; border-top: 1px solid var(--border); font-size: 0.85rem;
  }
  .holders-table tr:hover td { background: color-mix(in srgb, var(--surface) 50%, var(--border)); }
  .mono { font-family: monospace; color: var(--muted); font-size: 0.8rem; }
  .r { text-align: right; font-family: monospace; }
  .signal {
    display: inline-block; padding: 0.12rem 0.5rem; border-radius: 4px;
    font-size: 0.72rem; font-weight: 700; color: #fff;
  }

  @media (max-width: 700px) {
    .charts-grid { grid-template-columns: 1fr; }
    .search-box { flex-direction: column; }
    .header { padding: 1rem; }
    .search-wrap, .results, .status, .settings-panel { padding: 0 1rem; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>cointools</h1>
  <span class="tag">top holder tracker</span>
  <span class="spacer"></span>
  <button class="gear-btn" id="gearBtn" onclick="toggleSettings()">Settings</button>
</div>

<div class="settings-panel" id="settingsPanel">
  <div class="settings-inner">
    <p>
      EVM chains (Base, ETH) require a free Moralis API key.
      <a href="https://admin.moralis.io/register" target="_blank" rel="noopener">Get one here</a> — takes 30 seconds. Solana works without a key.
    </p>
    <div class="key-row">
      <input id="moralisKeyInput" type="text" placeholder="Paste Moralis API key..." />
      <button onclick="saveMoralisKey()">Save</button>
    </div>
    <div class="key-saved" id="keySaved">Key saved.</div>
  </div>
</div>

<div class="search-wrap">
  <div class="search-box">
    <input id="addressInput" type="text" placeholder="Paste token contract address..." spellcheck="false" autocomplete="off" />
    <button id="analyzeBtn" onclick="runAnalysis()">Analyze</button>
  </div>
  <div class="options-row">
    <label>Period:</label>
    <div class="pill-group" id="periodGroup">
      <button data-val="1h">1H</button>
      <button data-val="24h" class="active">24H</button>
      <button data-val="7d">7D</button>
      <button data-val="30d">30D</button>
    </div>
    <span id="chainBadge" class="chain-badge">chain: auto</span>
  </div>
</div>

<div class="status" id="status"></div>

<div class="results" id="results">
  <div class="summary-bar" id="summaryBar"></div>
  <div class="charts-grid">
    <div class="chart-card"><h3>Balance Changes</h3><canvas id="changeChart"></canvas></div>
    <div class="chart-card"><h3>Holder Sentiment</h3><canvas id="sentimentChart"></canvas></div>
  </div>
  <table class="holders-table">
    <thead><tr><th>#</th><th>Holder</th><th class="r">Balance</th><th class="r">Change</th><th>Signal</th></tr></thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
// ── Config ──────────────────────────────────────────────────
const SOLANA_RPCS = [
  'https://rpc.ankr.com/solana',
  'https://api.mainnet-beta.solana.com',
];
const MORALIS_BASE = 'https://deep-index.moralis.io/api/v2.2';
const EVM_RPCS = {
  base: 'https://rpc.ankr.com/base',
  eth: 'https://rpc.ankr.com/eth',
};
const MORALIS_CHAINS = { base: '0x2105', eth: '0x1' };
const PERIODS = { '1h': 3600, '24h': 86400, '7d': 604800, '30d': 2592000 };
const SIGNAL_COLORS = { BUY: '#22c55e', SELL: '#ef4444', HOLD: '#52525b', NEW: '#3b82f6' };

let changeChart = null, sentimentChart = null, selectedPeriod = '24h';

// ── Settings ────────────────────────────────────────────────
function getMoralisKey() { return localStorage.getItem('cointools_moralis_key') || ''; }
function saveMoralisKey() {
  const key = document.getElementById('moralisKeyInput').value.trim();
  if (!key) return;
  localStorage.setItem('cointools_moralis_key', key);
  document.getElementById('keySaved').style.display = 'block';
  updateGearBadge();
  setTimeout(() => { document.getElementById('keySaved').style.display = 'none'; }, 2000);
}
function toggleSettings() {
  document.getElementById('settingsPanel').classList.toggle('open');
}
function updateGearBadge() {
  const btn = document.getElementById('gearBtn');
  if (getMoralisKey()) btn.classList.add('has-key');
  else btn.classList.remove('has-key');
}

// Init: load saved key into input, update badge
document.addEventListener('DOMContentLoaded', () => {
  const saved = getMoralisKey();
  if (saved) document.getElementById('moralisKeyInput').value = saved;
  updateGearBadge();
});

// ── Period pills ────────────────────────────────────────────
document.querySelectorAll('#periodGroup button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelector('#periodGroup .active')?.classList.remove('active');
    btn.classList.add('active');
    selectedPeriod = btn.dataset.val;
  });
});

document.getElementById('addressInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') runAnalysis();
});

document.getElementById('addressInput').addEventListener('input', () => {
  const addr = document.getElementById('addressInput').value.trim();
  const badge = document.getElementById('chainBadge');
  if (addr.startsWith('0x') && addr.length === 42) {
    badge.textContent = 'chain: base (EVM)';
    badge.classList.add('detected');
  } else if (addr.length >= 32 && addr.length <= 44 && !addr.startsWith('0x')) {
    badge.textContent = 'chain: solana';
    badge.classList.add('detected');
  } else {
    badge.textContent = 'chain: auto';
    badge.classList.remove('detected');
  }
});

// ── Helpers ─────────────────────────────────────────────────
function shorten(addr, n = 4) {
  if (!addr) return '\u2014';
  return addr.length <= n * 2 + 2 ? addr : addr.slice(0, n) + '..' + addr.slice(-n);
}
function fmtBal(v) {
  if (v == null) return '\u2014';
  if (v >= 1e9) return (v / 1e9).toLocaleString(undefined, { maximumFractionDigits: 2 }) + 'B';
  if (v >= 1e6) return (v / 1e6).toLocaleString(undefined, { maximumFractionDigits: 2 }) + 'M';
  if (v >= 1e3) return v.toLocaleString(undefined, { maximumFractionDigits: 0 });
  return v.toLocaleString(undefined, { maximumFractionDigits: 2 });
}
function setStatus(msg, isError = false) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (isError ? ' error' : '');
}
function detectChain(addr) {
  return (addr.startsWith('0x') && addr.length === 42) ? 'base' : 'solana';
}
async function rpc(url, method, params) {
  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }),
  });
  if (!resp.ok) throw new Error(`RPC request failed (${resp.status})`);
  const data = await resp.json();
  if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
  return data.result;
}

// Solana RPC with automatic fallback across multiple endpoints
async function solanaRpc(method, params) {
  let lastErr;
  for (const url of SOLANA_RPCS) {
    try {
      return await rpc(url, method, params);
    } catch (e) {
      lastErr = e;
      console.warn(`RPC ${url} failed for ${method}: ${e.message}`);
    }
  }
  throw lastErr || new Error(`All Solana RPCs failed for ${method}`);
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── Solana analysis ─────────────────────────────────────────
async function analyzeSolana(mint, periodSecs) {
  setStatus('Fetching top 20 holders...');
  const res = await solanaRpc('getTokenLargestAccounts', [mint]);
  const accounts = res.value;
  if (!accounts || accounts.length === 0) throw new Error('No holders found for this token.');

  const holders = accounts.map((a, i) => ({
    tokenAccount: a.address,
    currentBalance: parseFloat(a.uiAmountString),
    decimals: a.decimals, rank: i + 1, owner: null, historicalBalance: null,
  }));

  setStatus(`Resolving ${holders.length} holder wallets...`);
  for (let i = 0; i < holders.length; i++) {
    try {
      const info = await solanaRpc('getAccountInfo', [holders[i].tokenAccount, { encoding: 'jsonParsed' }]);
      if (info?.value?.data?.parsed?.info?.owner) holders[i].owner = info.value.data.parsed.info.owner;
    } catch (_) {}
    if (i % 5 === 4) await sleep(150);
  }

  const targetTime = Math.floor(Date.now() / 1000) - periodSecs;
  for (let i = 0; i < holders.length; i++) {
    setStatus(`History for holder ${i + 1}/${holders.length}...`);
    try {
      holders[i].historicalBalance = await solanaHistoricalBalance(holders[i].tokenAccount, targetTime);
    } catch (_) {}
  }

  return holders.map(h => ({
    rank: h.rank, holderAddress: h.tokenAccount,
    ownerAddress: h.owner || h.tokenAccount,
    currentBalance: h.currentBalance, historicalBalance: h.historicalBalance,
  }));
}

async function solanaHistoricalBalance(tokenAccount, targetTime) {
  let before = undefined;
  for (let page = 0; page < 3; page++) {
    const opts = { limit: 500 };
    if (before) opts.before = before;
    await sleep(150);
    const sigs = await solanaRpc('getSignaturesForAddress', [tokenAccount, opts]);
    if (!sigs || sigs.length === 0) return null;

    for (const sig of sigs) {
      if (sig.blockTime && sig.blockTime <= targetTime) {
        await sleep(150);
        const tx = await solanaRpc('getTransaction', [
          sig.signature, { encoding: 'jsonParsed', maxSupportedTransactionVersion: 0 }
        ]);
        if (tx) { const b = extractSolBal(tx, tokenAccount); if (b !== null) return b; }
        return null;
      }
      before = sig.signature;
    }
    const lastTime = sigs[sigs.length - 1]?.blockTime || 0;
    if (lastTime < targetTime) {
      for (let j = sigs.length - 1; j >= 0; j--) {
        if (sigs[j].blockTime && sigs[j].blockTime >= targetTime) {
          await sleep(150);
          const tx = await solanaRpc('getTransaction', [
            sigs[j].signature, { encoding: 'jsonParsed', maxSupportedTransactionVersion: 0 }
          ]);
          if (tx) { const b = extractSolBal(tx, tokenAccount); if (b !== null) return b; }
          break;
        }
      }
      return null;
    }
  }
  return null;
}

function extractSolBal(tx, tokenAccount) {
  const keys = (tx?.transaction?.message?.accountKeys || []).map(k => typeof k === 'string' ? k : k.pubkey);
  for (const bal of (tx?.meta?.postTokenBalances || [])) {
    if (bal.accountIndex >= 0 && bal.accountIndex < keys.length && keys[bal.accountIndex] === tokenAccount) {
      const amt = bal.uiTokenAmount?.uiAmountString;
      if (amt != null) return parseFloat(amt);
    }
  }
  return null;
}

// ── EVM analysis (Moralis + standard RPC) ───────────────────
async function analyzeEVM(contract, chain, periodSecs) {
  const moralisKey = getMoralisKey();
  if (!moralisKey) {
    document.getElementById('settingsPanel').classList.add('open');
    throw new Error('EVM analysis requires a Moralis API key. Paste your free key above and try again.');
  }

  const evmRpc = EVM_RPCS[chain] || EVM_RPCS.base;
  const moralisChain = MORALIS_CHAINS[chain] || MORALIS_CHAINS.base;

  // Step 1: Get top holders from Moralis
  setStatus('Fetching top holders from Moralis...');
  const url = `${MORALIS_BASE}/erc20/${contract}/owners?chain=${moralisChain}&limit=20&order=DESC`;
  const resp = await fetch(url, { headers: { 'X-API-Key': moralisKey, 'Accept': 'application/json' } });
  if (resp.status === 401) throw new Error('Invalid Moralis API key. Check Settings and try again.');
  if (!resp.ok) throw new Error(`Moralis API error (${resp.status}). Check the contract address.`);
  const data = await resp.json();
  const rawHolders = data?.result || [];
  if (rawHolders.length === 0) throw new Error('No holders found. Check the contract address and chain.');

  // Step 2: Get decimals
  setStatus('Fetching token decimals...');
  let decimals = 18;
  try {
    const decResult = await rpc(evmRpc, 'eth_call', [{ to: contract, data: '0x313ce567' }, 'latest']);
    if (decResult && decResult !== '0x') decimals = parseInt(decResult, 16);
  } catch (_) {}

  // Step 3: Build holder list from Moralis response
  const holders = rawHolders.slice(0, 20).map((h, i) => {
    let bal = 0;
    try {
      // Moralis returns balance as a string of the raw integer
      bal = BigInt(h.balance || '0');
      bal = Number(bal) / (10 ** decimals);
    } catch (_) {
      try { bal = parseFloat(h.balance_formatted || '0'); } catch (_) {}
    }
    return {
      rank: i + 1, holderAddress: h.owner_address,
      ownerAddress: h.owner_address, currentBalance: bal, historicalBalance: null,
    };
  });

  // Step 4: Historical balances via eth_call at past block
  setStatus('Getting current block...');
  const blockHex = await rpc(evmRpc, 'eth_blockNumber', []);
  const currentBlock = parseInt(blockHex, 16);
  const blockTime = chain === 'arbitrum' ? 0.25 : (chain === 'eth' ? 12.0 : 2.0);
  const historicalBlock = Math.max(1, currentBlock - Math.floor(periodSecs / blockTime));

  for (let i = 0; i < holders.length; i++) {
    setStatus(`Historical balance ${i + 1}/${holders.length}...`);
    try {
      const padded = holders[i].holderAddress.toLowerCase().replace('0x', '').padStart(64, '0');
      const callData = '0x70a08231' + padded;
      const result = await rpc(evmRpc, 'eth_call', [
        { to: contract, data: callData }, '0x' + historicalBlock.toString(16)
      ]);
      if (result && result !== '0x') {
        holders[i].historicalBalance = Number(BigInt(result)) / (10 ** decimals);
      }
    } catch (_) {}
    if (i % 4 === 3) await sleep(100);
  }

  return holders;
}

// ── Signal classification ───────────────────────────────────
function classify(holders) {
  return holders.map(h => {
    const cur = h.currentBalance, hist = h.historicalBalance;
    let signal, change = null, changePct = null;
    if (hist == null) { signal = 'NEW'; }
    else {
      change = cur - hist;
      const eps = Math.max(cur, hist, 1) * 1e-9;
      if (Math.abs(change) < eps) { signal = 'HOLD'; change = 0; }
      else if (change > 0) signal = 'BUY';
      else signal = 'SELL';
      if (hist !== 0) changePct = (change / hist) * 100;
    }
    return { ...h, signal, change, changePct };
  });
}

// ── Render ──────────────────────────────────────────────────
function render(classified) {
  const buying = classified.filter(h => h.signal === 'BUY').length;
  const selling = classified.filter(h => h.signal === 'SELL').length;
  const holding = classified.filter(h => h.signal === 'HOLD').length;
  const unknown = classified.filter(h => h.signal === 'NEW').length;

  let sentiment, sentColor;
  if (buying > selling) { sentiment = 'ACCUMULATION'; sentColor = SIGNAL_COLORS.BUY; }
  else if (selling > buying) { sentiment = 'DISTRIBUTION'; sentColor = SIGNAL_COLORS.SELL; }
  else { sentiment = 'NEUTRAL'; sentColor = '#eab308'; }

  document.getElementById('summaryBar').innerHTML = `
    <div class="summary-stat"><div class="val" style="color:var(--green)">${buying}</div><div class="lbl">Buying</div></div>
    <div class="summary-stat"><div class="val" style="color:var(--red)">${selling}</div><div class="lbl">Selling</div></div>
    <div class="summary-stat"><div class="val">${holding}</div><div class="lbl">Holding</div></div>
    ${unknown ? `<div class="summary-stat"><div class="val" style="color:var(--blue)">${unknown}</div><div class="lbl">New</div></div>` : ''}
    <div class="sentiment-badge" style="background:${sentColor}">${sentiment}</div>`;

  document.getElementById('tableBody').innerHTML = classified.map(h => {
    let cs = '\u2014';
    if (h.change != null) {
      const p = h.change > 0 ? '+' : '';
      const pct = h.changePct != null ? ` (${p}${h.changePct.toFixed(1)}%)` : '';
      cs = `${p}${fmtBal(Math.abs(h.change))}${pct}`;
    }
    const c = SIGNAL_COLORS[h.signal] || '#52525b';
    return `<tr><td>${h.rank}</td><td class="mono">${shorten(h.ownerAddress,6)}</td>
      <td class="r">${fmtBal(h.currentBalance)}</td><td class="r" style="color:${c}">${cs}</td>
      <td><span class="signal" style="background:${c}">${h.signal}</span></td></tr>`;
  }).join('');

  const labels = classified.map(h => shorten(h.ownerAddress, 3));
  const changes = classified.map(h => h.change ?? 0);
  const colors = classified.map(h => SIGNAL_COLORS[h.signal]);

  if (changeChart) changeChart.destroy();
  changeChart = new Chart(document.getElementById('changeChart'), {
    type: 'bar',
    data: { labels, datasets: [{ data: changes, backgroundColor: colors, borderRadius: 3 }] },
    options: {
      responsive: true, plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#52525b', font: { size: 9 } }, grid: { display: false } },
        y: { ticks: { color: '#52525b' }, grid: { color: '#27272a' } }
      }
    }
  });

  const sentArr = [buying, selling, holding, unknown];
  const sentLbls = ['Buying','Selling','Holding','New'].filter((_,i) => sentArr[i] > 0);
  const sentVals = sentArr.filter(v => v > 0);
  const sentClrs = ['#22c55e','#ef4444','#52525b','#3b82f6'].filter((_,i) => sentArr[i] > 0);

  if (sentimentChart) sentimentChart.destroy();
  sentimentChart = new Chart(document.getElementById('sentimentChart'), {
    type: 'doughnut',
    data: { labels: sentLbls, datasets: [{ data: sentVals, backgroundColor: sentClrs, borderWidth: 0 }] },
    options: { responsive: true, cutout: '60%',
      plugins: { legend: { position: 'bottom', labels: { color: '#71717a', padding: 10, font: { size: 11 } } } } }
  });

  document.getElementById('results').classList.add('visible');
}

// ── Main ────────────────────────────────────────────────────
async function runAnalysis() {
  const address = document.getElementById('addressInput').value.trim();
  if (!address) { setStatus('Please enter a contract address.', true); return; }

  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  document.getElementById('results').classList.remove('visible');

  try {
    const chain = detectChain(address);
    const periodSecs = PERIODS[selectedPeriod];
    let holders;
    if (chain === 'solana') holders = await analyzeSolana(address, periodSecs);
    else holders = await analyzeEVM(address, chain, periodSecs);
    if (!holders || holders.length === 0) throw new Error('No holders found.');
    const classified = classify(holders);
    render(classified);
    setStatus(`Done \u2014 ${holders.length} holders analyzed on ${chain}.`);
  } catch (e) {
    setStatus(e.message || 'Something went wrong.', true);
    console.error(e);
  } finally {
    btn.disabled = false;
  }
}
</script>
